# =============================================================
# SparkFlow Reverse Proxy Configuration
# Public entry point : https://portal.example.com
# Backend target     : http://backend.example.internal:8080
# =============================================================

# -------------------------------------------------------------
# Phase 1a: Upstream definition
# -------------------------------------------------------------
upstream sparkflow_backend {
    server backend.example.internal:8080;

    # Keep connections alive to the backend (reduces latency)
    keepalive 32;
}

# -------------------------------------------------------------
# Phase 2: HTTP -> HTTPS redirect (force TLS)
# -------------------------------------------------------------
server {
    listen 80;
    server_name portal.example.com;

    # Allow ACME challenges without redirect if you use Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------
# Phase 3: Main HTTPS reverse proxy server block
# -------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.com;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/ssl/portal.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/portal.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- Security headers (server-side, not proxied) ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Logging (captures real client IP thanks to headers) ----
    access_log /var/log/nginx/sparkflow.access.log combined;
    error_log  /var/log/nginx/sparkflow.error.log warn;

    # ---- Phase 3: Hardening ----
    client_max_body_size      10m;   # reject uploads larger than 10 MB
    client_body_timeout       30s;
    client_header_timeout     30s;
    keepalive_timeout         65s;
    send_timeout              30s;

    # ---------------------------------------------------------
    # Phase 1b: Routing rule for the application
    # ---------------------------------------------------------
    location / {
        proxy_pass http://sparkflow_backend;

        # Path is preserved (e.g. /orders stays /orders).
        # To strip a prefix instead, use:
        #   location /api/ { proxy_pass http://sparkflow_backend/; }

        # -----------------------------------------------------
        # Phase 2: Forward client identity headers
        # -----------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Preserve upstream connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # -----------------------------------------------------
        # Phase 3: Timeouts & buffering
        # -----------------------------------------------------
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering      on;
        proxy_buffer_size    16k;
        proxy_buffers        8 16k;
        proxy_busy_buffers_size 32k;

        # Don't fail if backend sends large headers
        proxy_buffers 8 16k;
    }

    # ---------------------------------------------------------
    # Health check endpoint (optional but recommended)
    # ---------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------
    # Deny access to hidden files
    # ---------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
}
